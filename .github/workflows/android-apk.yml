name: Build signed Android APK

on:
  push:
    branches:
      - feature/android-apk-capacitor
  workflow_dispatch:

concurrency:
  group: clantb3st-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build CL4N TB3ST signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing GitHub secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing GitHub secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing GitHub secret ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing GitHub secret ANDROID_KEY_PASSWORD" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Prepare web and icon assets
        run: |
          npm run prepare:assets
          npm run build:web
          PATCH_TAG="ota-${GITHUB_RUN_NUMBER}"
          sed -i "s/__CL4NTB3ST_PATCH_VERSION__/${PATCH_TAG}/g" www/app.js

      - name: Package remote web patch
        run: |
          cd www
          zip -r ../clantb3st-web-bundle.zip .
          cd ..
          TAG="ota-${GITHUB_RUN_NUMBER}"
          CHECKSUM="$(sha256sum clantb3st-web-bundle.zip | cut -d ' ' -f1)"
          cat > patch-manifest.json <<EOF
          {
            "version": "${TAG}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/clantb3st-web-bundle.zip",
            "nativeApi": 1,
            "checksum": "${CHECKSUM}",
            "notes": "Actualización remota de CL4N TB3ST"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Generate native icon and splash resources
        run: npx capacitor-assets generate --android

      - name: Configure Android auth deep link
        run: node scripts/configure-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clantb3st-release.jks"
          test -s "$RUNNER_TEMP/clantb3st-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/clantb3st-release.jks" >> "$GITHUB_ENV"

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-signing.mjs

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Publish remote web patch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-${{ github.run_number }}
          name: CL4N TB3ST OTA ${{ github.run_number }}
          body: "Paquete web remoto de CL4N TB3ST. Se aplica desde la aplicación, sin reinstalar el APK."
          files: |
            clantb3st-web-bundle.zip
            patch-manifest.json
          make_latest: true
          draft: false
          prerelease: false

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CL4N-TB3ST-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
