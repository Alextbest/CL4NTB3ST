name: Build signed Android APK

on:
  push:
    branches:
      - feature/android-apk-capacitor
  workflow_dispatch:

concurrency:
  group: clantb3st-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build CL4N TB3ST signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing GitHub secret ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing GitHub secret ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing GitHub secret ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing GitHub secret ANDROID_KEY_PASSWORD" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Prepare web and icon assets
        run: |
          npm run prepare:assets
          npm run build:web
          PATCH_TAG="ota-${GITHUB_RUN_NUMBER}"
          sed -i "s/__CL4NTB3ST_PATCH_VERSION__/${PATCH_TAG}/g" www/app.js

      - name: Validate synchronized web assets
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('www/index.html', 'utf8');
          const sw = readFileSync('www/sw.js', 'utf8');
          const manifest = JSON.parse(readFileSync('www/manifest.webmanifest', 'utf8'));
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + duplicates.join(', '));
          const css = html.match(/href="(styles\.css\?v=\d+)"/)?.[1];
          const app = html.match(/src="(app\.js\?v=\d+)"/)?.[1];
          if (!css || !app || !sw.includes('./' + css) || !sw.includes('./' + app)) {
            throw new Error('HTML and service-worker asset versions are out of sync.');
          }
          const theme = html.match(/name="theme-color" content="([^"]+)"/)?.[1];
          if (!theme || theme !== manifest.theme_color) throw new Error('HTML and manifest theme colors do not match.');
          console.log('Web asset versions, HTML IDs, and theme colors are consistent.');
          NODE

      - name: Package remote web patch
        run: |
          cd www
          zip -r ../clantb3st-web-bundle.zip .
          cd ..
          TAG="ota-${GITHUB_RUN_NUMBER}"
          CHECKSUM="$(sha256sum clantb3st-web-bundle.zip | cut -d ' ' -f1)"
          cat > patch-manifest.json <<EOF
          {
            "version": "${TAG}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/clantb3st-web-bundle.zip",
            "nativeApi": 1,
            "checksum": "${CHECKSUM}",
            "notes": "TEMA MORADO Y AMARILLO. Superficies púrpura oscuras, texto blanco de alto contraste, acentos amarillos e iconos SVG consistentes.",
            "changes": [
              "Diseño unificado morado oscuro en paneles, tarjetas, encabezados y pantallas.",
              "Texto blanco y descripciones claras; campos oscuros con bordes violetas y foco amarillo.",
              "Iconos SVG normales con acentos amarillos y movimiento sutil en accesos rápidos.",
              "Se sincronizan versiones de recursos y se elimina la caché anterior al activar el nuevo service worker."
            ]
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Generate native icon and splash resources
        run: npx capacitor-assets generate --android

      - name: Configure Android auth deep link
        run: node scripts/configure-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clantb3st-release.jks"
          test -s "$RUNNER_TEMP/clantb3st-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/clantb3st-release.jks" >> "$GITHUB_ENV"

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-signing.mjs

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Publish remote web patch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-${{ github.run_number }}
          name: PARCHE OTA — TEMA MORADO Y AMARILLO
          body: "TEMA MORADO Y AMARILLO — superficies púrpura oscuras, texto de alto contraste, acentos amarillos e iconos SVG consistentes. Se instala desde la aplicación."
          files: |
            clantb3st-web-bundle.zip
            patch-manifest.json
          make_latest: false
          draft: false
          prerelease: false

      - name: Publish stable OTA manifest to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-manifest.json
          git commit -m "Publish OTA manifest ota-${GITHUB_RUN_NUMBER} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create APK update manifest
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TAG="apk-${GITHUB_RUN_NUMBER}"
          CHECKSUM="$(sha256sum "$APK" | cut -d ' ' -f1)"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          cat > apk-manifest.json <<EOF
          {
            "packageId": "com.clantb3st.app",
            "versionCode": ${GITHUB_RUN_NUMBER},
            "versionName": "${VERSION_NAME}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk",
            "sha256": "${CHECKSUM}",
            "notes": "Mejoras y correcciones de CL4N TB3ST"
          }
          EOF

      - name: Publish APK update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: CL4N TB3ST ${{ github.run_number }}
          body: "Actualización instalable de CL4N TB3ST. Descárgala desde la aplicación."
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            apk-manifest.json
            patch-manifest.json
          make_latest: true
          draft: false
          prerelease: false

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CL4N-TB3ST-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
