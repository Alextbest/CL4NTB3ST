name: Build Android APK

on:
  push:
    branches:
      - feature/android-apk-capacitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CL4N TB3ST APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web and icon assets
        run: |
          npm run prepare:assets
          npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate native icon and splash resources
        run: npx capacitor-assets generate --android

      - name: Configure Android auth deep link
        run: node scripts/configure-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CL4N-TB3ST-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
